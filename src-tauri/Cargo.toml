[package]
name = "vigil"
version = "0.1.0"
description = "VPN safety guard — warn before opening risky services without VPN"
authors = ["VIGIL contributors"]
edition = "2021"

[lib]
name = "vigil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.13"
sysinfo = "0.32"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"

